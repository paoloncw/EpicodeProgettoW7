<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsHub — Eventi sportivi</title>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>

    <header class="site-header">
      <h1>SportsHub</h1>
      <form id="search-form">
        <input type="text" id="search-input" placeholder="Cerca una squadra...">
        <button type="submit">Cerca</button>
      </form>
    </header>

    <main class="container">

      <section id="risultati-section">
        <div id="spinner" class="spinner" hidden></div>
        <div id="errore" class="alert" hidden></div>
        <div id="lista-squadre"></div>
      </section>

      <section id="dettagli-section" hidden>
        <!-- Visibile dopo click su una squadra: prossimi eventi + ultimi risultati -->
      </section>

    </main>

    <script src="assets/js/script.js"></script>
  </body>
</html>
